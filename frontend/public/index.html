<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Market — Full-Stack MERN Blog Platform with Comments (Thiranex Task 4)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      background: #090b10;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
    }

    /* Top MERN Status Strip */
    .mern-status-bar {
      background: #111520;
      border-bottom: 1px solid #1f273a;
      padding: 7px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12.5px;
      color: #9ca3af;
    }
    .mern-badge {
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 11.5px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .quick-switch-btn {
      background: #1a2130;
      color: #e5e7eb;
      border: 1px solid #2d3748;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quick-switch-btn:hover {
      background: #10b981;
      border-color: #10b981;
      color: #06130e;
      font-weight: 600;
    }

    /* Main Blog Market Navbar (matches tutorial Navbar.jsx) */
    .blog-navbar {
      background: #0e121b;
      border-bottom: 1px solid #1e2638;
      padding: 16px 6%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .blog-logo {
      font-size: 23px;
      font-weight: 800;
      color: #ffffff;
      background: none;
      border: none;
      cursor: pointer;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .blog-logo span {
      color: #10b981;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #161c2a;
      border: 1px solid #28324a;
      border-radius: 999px;
      padding: 7px 16px;
      flex: 0 1 340px;
      gap: 10px;
    }
    .search-box i {
      color: #9ca3af;
      font-size: 14px;
    }
    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      width: 100%;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .nav-link-btn {
      background: transparent;
      color: #d1d5db;
      border: none;
      font-size: 14.5px;
      font-weight: 600;
      padding: 8px 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link-btn:hover,
    .nav-link-btn.active {
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
    }
    .write-cta-btn {
      background: #10b981;
      color: #051610;
      border: none;
      font-size: 14px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.2s ease;
    }
    .write-cta-btn:hover {
      background: #059669;
      color: #ffffff;
    }
    .menu-burger-btn {
      background: #171e2e;
      color: #e5e7eb;
      border: 1px solid #2a354d;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .dropdown-menu {
      position: absolute;
      top: 48px;
      right: 0;
      background: #151b29;
      border: 1px solid #2a364f;
      border-radius: 12px;
      width: 200px;
      padding: 8px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 300;
    }
    .dropdown-menu.open {
      display: flex;
    }
    .dropdown-menu button {
      background: transparent;
      color: #e5e7eb;
      border: none;
      text-align: left;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .dropdown-menu button:hover {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    /* Main Content Wrapper */
    .main-container {
      flex: 1;
      padding: 28px 6%;
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
    }

    /* Category Filter Strip */
    .category-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1c2436;
    }
    .cat-pills {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cat-pill-btn {
      background: #141a26;
      color: #cbd5e1;
      border: 1px solid #263047;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .cat-pill-btn.active,
    .cat-pill-btn:hover {
      background: #10b981;
      border-color: #10b981;
      color: #051610;
      font-weight: 600;
    }

    /* HomePosts Card (matches tutorial 35% image left / 65% content right) */
    .post-card-horizontal {
      display: flex;
      gap: 24px;
      background: #121723;
      border: 1px solid #20293d;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 22px;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }
    .post-card-horizontal:hover {
      transform: translateY(-3px);
      border-color: #10b981;
    }
    .post-card-left {
      flex: 0 0 35%;
      max-width: 340px;
      border-radius: 10px;
      overflow: hidden;
      background: #0b0e16;
      aspect-ratio: 16 / 10;
    }
    .post-card-left img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .post-card-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .post-card-title {
      font-size: 21px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .post-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 10px;
    }
    .post-author-tag {
      color: #34d399;
    }
    .post-excerpt {
      font-size: 14.5px;
      color: #cbd5e1;
      margin-bottom: 14px;
      line-height: 1.6;
    }
    .post-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tag-badge {
      background: #1d2638;
      color: #93c5fd;
      border: 1px solid #2e3b56;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    /* PostDetails View */
    .post-details-wrap {
      max-width: 880px;
      margin: 0 auto;
      background: #121723;
      border: 1px solid #222c42;
      border-radius: 16px;
      padding: 32px;
    }
    .post-details-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .post-details-title {
      font-size: clamp(24px, 3.5vw, 34px);
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
    }
    .author-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-action-btn {
      background: #1d2639;
      color: #e5e7eb;
      border: 1px solid #303e5c;
      width: 38px;
      height: 38px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .icon-action-btn:hover {
      background: #10b981;
      color: #051610;
      border-color: #10b981;
    }
    .icon-action-btn.delete:hover {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
    }
    .post-hero-image {
      width: 100%;
      max-height: 440px;
      object-fit: cover;
      border-radius: 12px;
      margin: 18px 0 24px;
      border: 1px solid #253047;
    }
    .post-body-text {
      font-size: 16px;
      color: #e2e8f0;
      line-height: 1.8;
      white-space: pre-line;
      margin-bottom: 24px;
    }

    /* Comments Section (matches Comment.jsx) */
    .comments-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid #222c42;
    }
    .comment-card {
      background: #181f2e;
      border: 1px solid #263149;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .comment-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .comment-author {
      font-weight: 700;
      color: #34d399;
    }
    .comment-date {
      color: #9ca3af;
      font-size: 12px;
    }
    .comment-form-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }
    .comment-form-row input {
      flex: 1 1 260px;
      background: #0c1018;
      border: 1px solid #2b3752;
      border-radius: 8px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    .comment-form-row input:focus {
      border-color: #10b981;
    }

    /* CreatePost & EditPost Form */
    .editor-card {
      max-width: 780px;
      margin: 0 auto;
      background: #121723;
      border: 1px solid #222c42;
      border-radius: 16px;
      padding: 30px;
    }
    .form-field {
      margin-bottom: 16px;
    }
    .form-field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }
    .input-box,
    .textarea-box,
    .select-box {
      width: 100%;
      background: #0c1018;
      border: 1px solid #2a3650;
      border-radius: 8px;
      padding: 11px 14px;
      color: #ffffff;
      font-size: 14.5px;
      outline: none;
    }
    .input-box:focus,
    .textarea-box:focus,
    .select-box:focus {
      border-color: #10b981;
    }
    .cat-builder-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .active-cat-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    .active-cat-chip button {
      background: #ef4444;
      color: #ffffff;
      border: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Profile Page Layout (2-col: User Posts left, Sticky Profile Box right) */
    .profile-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 28px;
      align-items: start;
    }
    .profile-sidebar-card {
      background: #121723;
      border: 1px solid #222c42;
      border-radius: 14px;
      padding: 24px;
      position: sticky;
      top: 90px;
    }

    /* Footer */
    .blog-footer {
      background: #0c0f17;
      border-top: 1px solid #1c2436;
      padding: 28px 6%;
      margin-top: 50px;
      text-align: center;
      font-size: 13.5px;
      color: #9ca3af;
    }

    /* Toast */
    .toast-popup {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #141c2b;
      border-left: 4px solid #10b981;
      color: #ffffff;
      padding: 13px 18px;
      border-radius: 8px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.7);
      font-size: 13.5px;
      z-index: 1200;
      display: none;
      align-items: center;
      gap: 10px;
    }
    .toast-popup.show {
      display: flex;
    }

    @media (max-width: 820px) {
      .post-card-horizontal {
        flex-direction: column;
      }
      .post-card-left {
        max-width: 100%;
      }
      .profile-layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Top MERN Status Bar -->
  <div class="mern-status-bar">
    <div>
      <span class="mern-badge"><i class="fa-solid fa-leaf"></i> Thiranex Task 4: MERN Blog Platform ("Blog Market")</span>
      <span style="margin-left:8px;">Auth + Post CRUD + Category Tags + Comments + Search</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span id="status-user-indicator">Logged in as <strong>@snehasish_dev</strong></span>
      <button type="button" class="quick-switch-btn" onclick="switchDemoAuthor()">
        <i class="fa-solid fa-repeat"></i> Switch Demo User
      </button>
    </div>
  </div>

  <!-- Main Navbar -->
  <header class="blog-navbar">
    <button type="button" class="blog-logo" onclick="navigateBlog('home')">
      <i class="fa-solid fa-feather-pointed" style="color:#10b981;"></i> Blog<span>Market</span>
    </button>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="blog-search-input" placeholder="Search a post by title or topic..." oninput="handleLiveSearch(this.value)" />
    </div>

    <div class="nav-actions" id="nav-actions-container"></div>
  </header>

  <!-- Dynamic Main View -->
  <main class="main-container" id="blog-main-view"></main>

  <footer class="blog-footer">
    <p>All rights reserved &copy; 2026 <strong>Blog Market</strong> — Full-Stack MERN Blogging Platform (Thiranex Internship Task 4)</p>
  </footer>

  <!-- Toast Notification -->
  <div class="toast-popup" id="blog-toast">
    <i class="fa-solid fa-circle-check" style="color:#10b981;font-size:18px;"></i>
    <span id="blog-toast-text">Action completed!</span>
  </div>

  <script>
    const COVER_IMAGES = {
      ai: "images/post-ai.jpg",
      cloud: "images/post-cloud.jpg",
      design: "images/post-design.jpg"
    };

    const INITIAL_BLOG_USERS = [
      {
        _id: "u1",
        username: "snehasish_dev",
        email: "snehasish@blogmarket.dev",
        password: "1234",
        bio: "Full-Stack MERN Developer & Technical Writer sharing guides on React, Node.js, and AI."
      },
      {
        _id: "u2",
        username: "john_coder",
        email: "john@gmail.com",
        password: "john",
        bio: "Cloud Architect & Open-Source Contributor exploring distributed databases and DevOps."
      }
    ];

    const INITIAL_BLOG_POSTS = [
      {
        _id: "post-101",
        title: "Architecting Scalable Generative AI Pipelines with Node.js and Vector Databases",
        desc: "Artificial Intelligence is transforming how modern web applications interact with users. By combining Node.js streams, Express RESTful APIs, and retrieval-augmented generation (RAG), developers can deliver low-latency semantic search and conversational experiences.\n\nIn this deep dive, we explore how to chunk markdown documents, generate embeddings, and cache responses effectively in MongoDB Atlas while keeping token usage predictable.",
        photo: COVER_IMAGES.ai,
        username: "snehasish_dev",
        userId: "u1",
        categories: ["Artificial Intelligence", "Node.js", "MERN Stack"],
        createdAt: "2026-10-29 18:30"
      },
      {
        _id: "post-102",
        title: "Building a Full-Stack MERN Blog Application with JWT Cookie Authentication",
        desc: "Securing a single-page React application requires more than storing tokens in plain view. Using HTTP-only cookies with Express cookie-parser and a custom verifyToken middleware prevents XSS token theft while supporting seamless session refetching on page reload.\n\nWe also walk through configuring Multer diskStorage for static image uploads and designing Mongoose schemas for Users, Posts, and nested Comments.",
        photo: COVER_IMAGES.cloud,
        username: "snehasish_dev",
        userId: "u1",
        categories: ["Web Development", "MERN Stack", "Security"],
        createdAt: "2026-10-30 11:45"
      },
      {
        _id: "post-103",
        title: "Designing High-Contrast Dark Mode Interfaces with Tailwind CSS and Vite",
        desc: "A great developer platform balances information density with visual breathing room. Using slate and obsidian surface hierarchies alongside emerald focal accents ensures WCAG AA contrast compliance across both desktop monitors and mobile viewports.\n\nLearn how to structure responsive flexbox cards, sticky profile sidebars, and skeleton loaders in React.",
        photo: COVER_IMAGES.design,
        username: "john_coder",
        userId: "u2",
        categories: ["UI/UX Design", "Tailwind CSS", "React.js"],
        createdAt: "2026-10-31 09:15"
      }
    ];

    const INITIAL_BLOG_COMMENTS = [
      {
        _id: "c-1",
        comment: "Super clear explanation of HTTP-only JWT cookies and the /api/auth/refetch endpoint! Helped me fix my session persistence bug.",
        author: "john_coder",
        postId: "post-102",
        userId: "u2",
        createdAt: "2026-10-30 14:10"
      },
      {
        _id: "c-2",
        comment: "Thanks John! Next up I am adding full-text regex search and category tag filtering.",
        author: "snehasish_dev",
        postId: "post-102",
        userId: "u1",
        createdAt: "2026-10-30 15:02"
      },
      {
        _id: "c-3",
        comment: "The RAG caching benchmarks with MongoDB Atlas are spot on. Great write-up!",
        author: "john_coder",
        postId: "post-101",
        userId: "u2",
        createdAt: "2026-10-29 20:05"
      }
    ];

    let state = {
      view: "home", // home | post_details | create_post | edit_post | my_blogs | profile | login | register
      currentUser: INITIAL_BLOG_USERS[0],
      users: [...INITIAL_BLOG_USERS],
      posts: [...INITIAL_BLOG_POSTS],
      comments: [...INITIAL_BLOG_COMMENTS],
      activePostId: "post-102",
      editingPostId: null,
      searchQuery: "",
      selectedCategory: "All",
      draftCategories: ["Web Development", "MERN Stack"],
      customUploadedPhoto: "",
      menuOpen: false
    };

    function loadBlogState() {
      try {
        const raw = localStorage.getItem("thiranex_task4_blog_market_state");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed.users) && parsed.users.length > 0) state.users = parsed.users;
          if (Array.isArray(parsed.posts) && parsed.posts.length > 0) {
            const pool = [COVER_IMAGES.ai, COVER_IMAGES.cloud, COVER_IMAGES.design];
            state.posts = parsed.posts.map((p, idx) => ({
              ...p,
              photo: p.photo && p.photo.startsWith("data:") ? p.photo : pool[idx % 3]
            }));
          }
          if (Array.isArray(parsed.comments)) state.comments = parsed.comments;
          if ("currentUser" in parsed) state.currentUser = parsed.currentUser;
        }
      } catch (e) {
        // Ignore storage error in restricted iframe
      }
    }

    function saveBlogState() {
      try {
        localStorage.setItem("thiranex_task4_blog_market_state", JSON.stringify(state));
      } catch (e) {
        // Ignore
      }
    }

    function showBlogToast(msg) {
      const box = document.getElementById("blog-toast");
      const text = document.getElementById("blog-toast-text");
      if (!box || !text) return;
      text.textContent = msg;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 3000);
    }

    function switchDemoAuthor() {
      if (!state.currentUser || state.currentUser._id === "u2") {
        state.currentUser = state.users[0];
      } else {
        state.currentUser = state.users[1] || state.users[0];
      }
      saveBlogState();
      renderNavbar();
      renderMainView();
      showBlogToast(`Switched active user to @${state.currentUser.username}`);
    }

    function toggleMenuDropdown() {
      state.menuOpen = !state.menuOpen;
      const menuEl = document.getElementById("navbar-dropdown");
      if (menuEl) {
        menuEl.classList.toggle("open", state.menuOpen);
      }
    }

    function navigateBlog(viewName) {
      state.view = viewName;
      state.menuOpen = false;
      if (viewName === "create_post") {
        state.draftCategories = ["MERN Stack", "React.js"];
        state.customUploadedPhoto = "";
      }
      renderNavbar();
      renderMainView();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function handleLiveSearch(val) {
      state.searchQuery = val.trim();
      if (state.view !== "home" && state.view !== "my_blogs") {
        state.view = "home";
      }
      renderMainView();
    }

    function filterByCategoryPill(cat) {
      state.selectedCategory = cat;
      renderMainView();
    }

    function renderNavbar() {
      const statusInd = document.getElementById("status-user-indicator");
      const navContainer = document.getElementById("nav-actions-container");
      if (!navContainer) return;

      if (state.currentUser) {
        statusInd.innerHTML = `Logged in as <strong>@${state.currentUser.username}</strong>`;
        navContainer.innerHTML = `
          <button type="button" class="nav-link-btn ${state.view === 'home' ? 'active' : ''}" onclick="navigateBlog('home')">Home</button>
          <button type="button" class="nav-link-btn ${state.view === 'my_blogs' ? 'active' : ''}" onclick="navigateBlog('my_blogs')">My Blogs</button>
          <button type="button" class="nav-link-btn ${state.view === 'profile' ? 'active' : ''}" onclick="navigateBlog('profile')">Profile</button>
          <button type="button" class="write-cta-btn" onclick="navigateBlog('create_post')">
            <i class="fa-solid fa-pen-nib"></i> Write
          </button>
          <button type="button" class="menu-burger-btn" onclick="toggleMenuDropdown()" aria-label="Menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="dropdown-menu ${state.menuOpen ? 'open' : ''}" id="navbar-dropdown">
            <button type="button" onclick="navigateBlog('profile')"><i class="fa-solid fa-user"></i> Profile (@${state.currentUser.username})</button>
            <button type="button" onclick="navigateBlog('create_post')"><i class="fa-solid fa-pen"></i> Write a Post</button>
            <button type="button" onclick="navigateBlog('my_blogs')"><i class="fa-solid fa-book-open"></i> My Blogs</button>
            <button type="button" onclick="handleLogout()" style="color:#f87171;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
          </div>
        `;
      } else {
        statusInd.textContent = "Viewing as Guest (Not logged in)";
        navContainer.innerHTML = `
          <button type="button" class="nav-link-btn ${state.view === 'home' ? 'active' : ''}" onclick="navigateBlog('home')">Home</button>
          <button type="button" class="nav-link-btn ${state.view === 'login' ? 'active' : ''}" onclick="navigateBlog('login')">Login</button>
          <button type="button" class="write-cta-btn" onclick="navigateBlog('register')">Register</button>
        `;
      }
    }

    function handleLogout() {
      state.currentUser = null;
      state.menuOpen = false;
      saveBlogState();
      renderNavbar();
      navigateBlog("login");
      showBlogToast("Logged out and JWT cookie cleared.");
    }

    function renderMainView() {
      const container = document.getElementById("blog-main-view");
      if (!container) return;

      if (state.view === "home") {
        container.innerHTML = renderFeedView(false);
      } else if (state.view === "my_blogs") {
        container.innerHTML = renderFeedView(true);
      } else if (state.view === "post_details") {
        container.innerHTML = renderPostDetailsView();
      } else if (state.view === "create_post") {
        container.innerHTML = renderPostEditorView(false);
      } else if (state.view === "edit_post") {
        container.innerHTML = renderPostEditorView(true);
      } else if (state.view === "profile") {
        container.innerHTML = renderProfileView();
      } else if (state.view === "login") {
        container.innerHTML = renderLoginView();
      } else if (state.view === "register") {
        container.innerHTML = renderRegisterView();
      }
    }

    // 1. Home & My Blogs Feed View
    function renderFeedView(onlyMyBlogs) {
      const allCategories = ["All"];
      state.posts.forEach(p => {
        (p.categories || []).forEach(c => {
          if (!allCategories.includes(c)) allCategories.push(c);
        });
      });

      let list = [...state.posts];
      if (onlyMyBlogs && state.currentUser) {
        list = list.filter(p => p.userId === state.currentUser._id || p.username === state.currentUser.username);
      }
      if (state.selectedCategory !== "All") {
        list = list.filter(p => (p.categories || []).includes(state.selectedCategory));
      }
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        list = list.filter(p =>
          p.title.toLowerCase().includes(q) ||
          p.desc.toLowerCase().includes(q) ||
          p.username.toLowerCase().includes(q) ||
          (p.categories || []).some(c => c.toLowerCase().includes(q))
        );
      }

      const cardsHtml = list.length === 0 ? `
        <div style="background:#121723;border:1px dashed #2d3a54;border-radius:14px;padding:48px 24px;text-align:center;">
          <h3 style="font-size:20px;color:#ffffff;margin-bottom:8px;">No posts available</h3>
          <p style="color:#9ca3af;font-size:14px;margin-bottom:18px;">No blog posts matched your current filter or search query.</p>
          ${state.currentUser ? `
            <button type="button" class="write-cta-btn" onclick="navigateBlog('create_post')">
              <i class="fa-solid fa-plus"></i> Create Your First Post
            </button>
          ` : ""}
        </div>
      ` : list.map(post => {
        const commentCount = state.comments.filter(c => c.postId === post._id).length;
        const snippet = post.desc.length > 210 ? post.desc.slice(0, 210) + " ...Read more" : post.desc;
        return `
          <article class="post-card-horizontal" onclick="openPostDetails('${post._id}')">
            <div class="post-card-left">
              <img src="${post.photo}" alt="${post.title}" />
            </div>
            <div class="post-card-right">
              <div>
                <h2 class="post-card-title">${post.title}</h2>
                <div class="post-meta-row">
                  <span class="post-author-tag">@${post.username}</span>
                  <span><i class="fa-regular fa-clock"></i> ${post.createdAt}</span>
                </div>
                <p class="post-excerpt">${snippet}</p>
              </div>
              <div class="post-card-footer">
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  ${(post.categories || []).map(c => `<span class="tag-badge">${c}</span>`).join("")}
                </div>
                <span style="font-size:12.5px;color:#9ca3af;">
                  <i class="fa-regular fa-comments" style="color:#10b981;margin-right:4px;"></i> ${commentCount} comment(s)
                </span>
              </div>
            </div>
          </article>
        `;
      }).join("");

      return `
        <div class="category-filter-row">
          <div>
            <h1 style="font-size:24px;font-weight:800;color:#ffffff;">
              ${onlyMyBlogs ? `My Blogs (@${state.currentUser ? state.currentUser.username : ''})` : "Latest Community Posts"}
            </h1>
          </div>
          <div class="cat-pills">
            ${allCategories.map(cat => `
              <button type="button" class="cat-pill-btn ${state.selectedCategory === cat ? 'active' : ''}" onclick="filterByCategoryPill('${cat}')">
                ${cat}
              </button>
            `).join("")}
          </div>
        </div>
        ${cardsHtml}
      `;
    }

    function openPostDetails(postId) {
      state.activePostId = postId;
      navigateBlog("post_details");
    }

    // 2. Post Details & Comments View (PostDetails.jsx)
    function renderPostDetailsView() {
      const post = state.posts.find(p => p._id === state.activePostId) || state.posts[0];
      if (!post) return renderFeedView(false);

      const isOwner = state.currentUser && (state.currentUser._id === post.userId || state.currentUser.username === post.username);
      const postComments = state.comments.filter(c => c.postId === post._id);

      return `
        <div style="margin-bottom:16px;">
          <button type="button" class="nav-link-btn" onclick="navigateBlog('home')">
            <i class="fa-solid fa-arrow-left"></i> Back to Feed
          </button>
        </div>

        <div class="post-details-wrap">
          <div class="post-details-header">
            <h1 class="post-details-title">${post.title}</h1>
            ${isOwner ? `
              <div class="author-actions">
                <button type="button" class="icon-action-btn" onclick="startEditPost('${post._id}')" title="Edit Post">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button type="button" class="icon-action-btn delete" onclick="handleDeletePost('${post._id}')" title="Delete Post">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            ` : ""}
          </div>

          <div class="post-meta-row" style="margin-bottom:14px;">
            <span class="post-author-tag" style="font-size:14.5px;">By @${post.username}</span>
            <span>Published ${post.createdAt}</span>
          </div>

          <img src="${post.photo}" alt="${post.title}" class="post-hero-image" />

          <div class="post-body-text">${post.desc}</div>

          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <strong style="font-size:14px;color:#9ca3af;">Categories:</strong>
            ${(post.categories || []).map(c => `<span class="tag-badge">${c}</span>`).join("")}
          </div>

          <!-- Comments Section -->
          <div class="comments-section">
            <h3 style="font-size:18px;font-weight:700;color:#ffffff;margin-bottom:14px;">
              Comments (${postComments.length})
            </h3>

            <div id="comments-list-box">
              ${postComments.length === 0 ? `<p style="color:#9ca3af;font-size:14px;margin-bottom:12px;">No comments yet. Start the discussion below!</p>` :
                postComments.map(c => {
                  const canDeleteComment = state.currentUser && (state.currentUser._id === c.userId || state.currentUser.username === c.author);
                  return `
                    <div class="comment-card">
                      <div class="comment-header">
                        <span class="comment-author">@${c.author}</span>
                        <div style="display:flex;align-items:center;gap:10px;">
                          <span class="comment-date">${c.createdAt}</span>
                          ${canDeleteComment ? `
                            <button type="button" style="background:none;border:none;color:#f87171;cursor:pointer;" onclick="handleDeleteComment('${c._id}')" title="Delete Comment">
                              <i class="fa-solid fa-trash"></i>
                            </button>
                          ` : ""}
                        </div>
                      </div>
                      <p style="font-size:14px;color:#e5e7eb;">${c.comment}</p>
                    </div>
                  `;
                }).join("")}
            </div>

            ${state.currentUser ? `
              <form class="comment-form-row" onsubmit="handleAddComment(event, '${post._id}')">
                <input type="text" id="new-comment-input" placeholder="Write a comment as @${state.currentUser.username}..." required />
                <button type="submit" class="write-cta-btn">Add Comment</button>
              </form>
            ` : `
              <p style="margin-top:14px;font-size:13.5px;color:#9ca3af;">
                Please <button type="button" style="background:none;border:none;color:#34d399;font-weight:700;cursor:pointer;" onclick="navigateBlog('login')">Login</button> to post a comment.
              </p>
            `}
          </div>
        </div>
      `;
    }

    function handleAddComment(e, postId) {
      e.preventDefault();
      if (!state.currentUser) {
        navigateBlog("login");
        return;
      }
      const input = document.getElementById("new-comment-input");
      const text = input.value.trim();
      if (!text) return;

      const now = new Date().toISOString().slice(0, 16).replace("T", " ");
      state.comments.push({
        _id: "c-" + Date.now(),
        comment: text,
        author: state.currentUser.username,
        postId,
        userId: state.currentUser._id,
        createdAt: now
      });
      saveBlogState();
      renderMainView();
      showBlogToast("Comment published!");
    }

    function handleDeleteComment(commentId) {
      state.comments = state.comments.filter(c => c._id !== commentId);
      saveBlogState();
      renderMainView();
      showBlogToast("Comment deleted.");
    }

    // 3. CreatePost & EditPost View (CreatePost.jsx / EditPost.jsx)
    function startEditPost(postId) {
      const post = state.posts.find(p => p._id === postId);
      if (!post) return;
      state.editingPostId = postId;
      state.draftCategories = [...(post.categories || [])];
      state.customUploadedPhoto = "";
      state.view = "edit_post";
      renderNavbar();
      renderMainView();
    }

    function handleDeletePost(postId) {
      state.posts = state.posts.filter(p => p._id !== postId);
      state.comments = state.comments.filter(c => c.postId !== postId);
      saveBlogState();
      showBlogToast("Post and its comments deleted.");
      navigateBlog("home");
    }

    function renderPostEditorView(isEdit) {
      if (!state.currentUser) return renderLoginView();
      const post = isEdit ? state.posts.find(p => p._id === state.editingPostId) : null;

      return `
        <div class="editor-card">
          <h2 style="font-size:24px;font-weight:800;color:#ffffff;margin-bottom:18px;">
            ${isEdit ? "Update Blog Post" : "Create a New Blog Post"}
          </h2>
          <form onsubmit="handleSavePostSubmit(event, ${isEdit ? `'${post._id}'` : 'null'})">
            <div class="form-field">
              <label>Post Title</label>
              <input type="text" id="post-title-input" class="input-box" value="${post ? post.title : ''}" placeholder="Enter post title..." required />
            </div>

            <div class="form-field">
              <label>Cover Image (Choose Preset or Upload File via Multer / FileReader)</label>
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
                <select id="post-preset-img" class="select-box">
                  <option value="ai">AI &amp; Neural Networks Cover</option>
                  <option value="cloud">Cloud &amp; MERN Architecture Cover</option>
                  <option value="design">Dark Mode UI/UX Workspace Cover</option>
                </select>
                <input type="file" accept="image/*" class="input-box" style="padding:8px;" onchange="handleCoverFileUpload(event)" />
              </div>
            </div>

            <div class="form-field">
              <label>Post Categories (Type a category and click Add)</label>
              <div class="cat-builder-row">
                <input type="text" id="cat-tag-input" class="input-box" placeholder="Enter post category (e.g., Next.js, DevOps)" />
                <button type="button" class="write-cta-btn" onclick="addDraftCategory()">Add</button>
              </div>
              <div id="draft-cats-container">
                ${state.draftCategories.map((c, idx) => `
                  <span class="active-cat-chip">
                    ${c}
                    <button type="button" onclick="removeDraftCategory(${idx})" title="Remove category">&times;</button>
                  </span>
                `).join("")}
              </div>
            </div>

            <div class="form-field">
              <label>Post Content / Description</label>
              <textarea id="post-desc-input" rows="9" class="textarea-box" placeholder="Write your full article content here..." required>${post ? post.desc : ''}</textarea>
            </div>

            <div style="display:flex;gap:12px;">
              <button type="submit" class="write-cta-btn" style="padding:11px 28px;font-size:15px;">
                ${isEdit ? "Update Post" : "Publish Post"}
              </button>
              <button type="button" class="nav-link-btn" onclick="navigateBlog('home')">Cancel</button>
            </div>
          </form>
        </div>
      `;
    }

    function handleCoverFileUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        state.customUploadedPhoto = reader.result;
        showBlogToast("Custom cover image loaded!");
      };
      reader.readAsDataURL(file);
    }

    function addDraftCategory() {
      const input = document.getElementById("cat-tag-input");
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      if (!state.draftCategories.includes(val)) {
        state.draftCategories.push(val);
      }
      input.value = "";
      const box = document.getElementById("draft-cats-container");
      if (box) {
        box.innerHTML = state.draftCategories.map((c, idx) => `
          <span class="active-cat-chip">
            ${c}
            <button type="button" onclick="removeDraftCategory(${idx})">&times;</button>
          </span>
        `).join("");
      }
    }

    function removeDraftCategory(idx) {
      state.draftCategories.splice(idx, 1);
      const box = document.getElementById("draft-cats-container");
      if (box) {
        box.innerHTML = state.draftCategories.map((c, i) => `
          <span class="active-cat-chip">
            ${c}
            <button type="button" onclick="removeDraftCategory(${i})">&times;</button>
          </span>
        `).join("");
      }
    }

    function handleSavePostSubmit(e, editPostId) {
      e.preventDefault();
      const title = document.getElementById("post-title-input").value.trim();
      const desc = document.getElementById("post-desc-input").value.trim();
      const presetKey = document.getElementById("post-preset-img").value;
      if (!title || !desc) return;

      const photo = state.customUploadedPhoto || COVER_IMAGES[presetKey] || COVER_IMAGES.ai;
      const categories = state.draftCategories.length > 0 ? [...state.draftCategories] : ["General"];

      if (editPostId) {
        const post = state.posts.find(p => p._id === editPostId);
        if (post) {
          post.title = title;
          post.desc = desc;
          post.categories = categories;
          if (state.customUploadedPhoto || presetKey) post.photo = photo;
        }
        saveBlogState();
        state.activePostId = editPostId;
        showBlogToast("Post updated successfully!");
        navigateBlog("post_details");
      } else {
        const newId = "post-" + Date.now();
        state.posts.unshift({
          _id: newId,
          title,
          desc,
          photo,
          username: state.currentUser.username,
          userId: state.currentUser._id,
          categories,
          createdAt: new Date().toISOString().slice(0, 16).replace("T", " ")
        });
        saveBlogState();
        state.activePostId = newId;
        showBlogToast("New blog post published!");
        navigateBlog("post_details");
      }
    }

    // 4. Profile View (Profile.jsx)
    function renderProfileView() {
      if (!state.currentUser) return renderLoginView();
      const u = state.currentUser;
      const myPosts = state.posts.filter(p => p.userId === u._id || p.username === u.username);

      return `
        <div class="profile-layout">
          <div>
            <h2 style="font-size:22px;font-weight:800;margin-bottom:16px;">Your Published Posts (${myPosts.length})</h2>
            ${myPosts.length === 0 ? `
              <div style="background:#121723;border:1px dashed #2d3a54;border-radius:14px;padding:36px;text-align:center;">
                <p style="color:#9ca3af;margin-bottom:12px;">You haven't published any posts yet.</p>
                <button type="button" class="write-cta-btn" onclick="navigateBlog('create_post')">Write a Post</button>
              </div>
            ` : myPosts.map(post => `
              <article class="post-card-horizontal" onclick="openPostDetails('${post._id}')">
                <div class="post-card-left">
                  <img src="${post.photo}" alt="${post.title}" />
                </div>
                <div class="post-card-right">
                  <div>
                    <h3 class="post-card-title">${post.title}</h3>
                    <div class="post-meta-row">
                      <span class="post-author-tag">@${post.username}</span>
                      <span>${post.createdAt}</span>
                    </div>
                    <p class="post-excerpt">${post.desc.slice(0, 150)}...</p>
                  </div>
                </div>
              </article>
            `).join("")}
          </div>

          <aside class="profile-sidebar-card">
            <h3 style="font-size:19px;font-weight:800;margin-bottom:14px;color:#34d399;">Profile Settings</h3>
            <form onsubmit="handleUpdateProfile(event)">
              <div class="form-field">
                <label>Username</label>
                <input type="text" id="prof-username" class="input-box" value="${u.username}" required />
              </div>
              <div class="form-field">
                <label>Email</label>
                <input type="email" id="prof-email" class="input-box" value="${u.email}" required />
              </div>
              <div class="form-field">
                <label>Bio</label>
                <textarea id="prof-bio" rows="3" class="textarea-box">${u.bio || ''}</textarea>
              </div>
              <div style="display:flex;gap:10px;margin-top:16px;">
                <button type="submit" class="write-cta-btn" style="flex:1;justify-content:center;">Update</button>
                <button type="button" class="icon-action-btn delete" style="width:auto;padding:0 14px;font-size:13px;font-weight:600;" onclick="handleDeleteUserAccount()">
                  Delete Account
                </button>
              </div>
            </form>
          </aside>
        </div>
      `;
    }

    function handleUpdateProfile(e) {
      e.preventDefault();
      const newName = document.getElementById("prof-username").value.trim();
      const newEmail = document.getElementById("prof-email").value.trim();
      const newBio = document.getElementById("prof-bio").value.trim();
      if (!newName || !newEmail) return;

      const oldName = state.currentUser.username;
      state.currentUser.username = newName;
      state.currentUser.email = newEmail;
      state.currentUser.bio = newBio;

      state.posts.forEach(p => {
        if (p.userId === state.currentUser._id || p.username === oldName) {
          p.username = newName;
        }
      });
      state.comments.forEach(c => {
        if (c.userId === state.currentUser._id || c.author === oldName) {
          c.author = newName;
        }
      });

      saveBlogState();
      renderNavbar();
      renderMainView();
      showBlogToast("User profile updated successfully!");
    }

    function handleDeleteUserAccount() {
      const uid = state.currentUser._id;
      state.posts = state.posts.filter(p => p.userId !== uid);
      state.comments = state.comments.filter(c => c.userId !== uid);
      state.users = state.users.filter(u => u._id !== uid);
      state.currentUser = null;
      saveBlogState();
      renderNavbar();
      navigateBlog("home");
      showBlogToast("User account and associated posts/comments deleted.");
    }

    // 5. Login & Register Views
    function renderLoginView() {
      return `
        <div class="editor-card" style="max-width:460px;">
          <h2 style="font-size:24px;font-weight:800;margin-bottom:6px;text-align:center;">Log in to your account</h2>
          <p style="font-size:13px;color:#9ca3af;text-align:center;margin-bottom:18px;">Demo account pre-filled (<code>snehasish@blogmarket.dev</code> / <code>1234</code>)</p>
          <form onsubmit="handleBlogLogin(event)">
            <div class="form-field">
              <label>Email</label>
              <input type="email" id="blog-login-email" class="input-box" value="snehasish@blogmarket.dev" required />
            </div>
            <div class="form-field">
              <label>Password</label>
              <input type="password" id="blog-login-pass" class="input-box" value="1234" required />
            </div>
            <button type="submit" class="write-cta-btn" style="width:100%;justify-content:center;padding:12px;">Log in</button>
          </form>
          <p style="margin-top:16px;font-size:13.5px;text-align:center;color:#9ca3af;">
            New here? <button type="button" style="background:none;border:none;color:#34d399;font-weight:700;cursor:pointer;" onclick="navigateBlog('register')">Register</button>
          </p>
        </div>
      `;
    }

    function handleBlogLogin(e) {
      e.preventDefault();
      const email = document.getElementById("blog-login-email").value.trim().toLowerCase();
      const pass = document.getElementById("blog-login-pass").value.trim();
      const found = state.users.find(u => u.email.toLowerCase() === email && u.password === pass);
      if (!found) {
        showBlogToast("Invalid email or password!");
        return;
      }
      state.currentUser = found;
      saveBlogState();
      renderNavbar();
      navigateBlog("home");
      showBlogToast(`Welcome back, @${found.username}!`);
    }

    function renderRegisterView() {
      return `
        <div class="editor-card" style="max-width:460px;">
          <h2 style="font-size:24px;font-weight:800;margin-bottom:6px;text-align:center;">Create an account</h2>
          <p style="font-size:13px;color:#9ca3af;text-align:center;margin-bottom:18px;">Join Blog Market to publish articles and comment on posts.</p>
          <form onsubmit="handleBlogRegister(event)">
            <div class="form-field">
              <label>Username</label>
              <input type="text" id="blog-reg-username" class="input-box" placeholder="Enter your username" required />
            </div>
            <div class="form-field">
              <label>Email</label>
              <input type="email" id="blog-reg-email" class="input-box" placeholder="Enter your email" required />
            </div>
            <div class="form-field">
              <label>Password</label>
              <input type="password" id="blog-reg-pass" class="input-box" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="write-cta-btn" style="width:100%;justify-content:center;padding:12px;">Register</button>
          </form>
          <p style="margin-top:16px;font-size:13.5px;text-align:center;color:#9ca3af;">
            Already have an account? <button type="button" style="background:none;border:none;color:#34d399;font-weight:700;cursor:pointer;" onclick="navigateBlog('login')">Login</button>
          </p>
        </div>
      `;
    }

    function handleBlogRegister(e) {
      e.preventDefault();
      const username = document.getElementById("blog-reg-username").value.trim();
      const email = document.getElementById("blog-reg-email").value.trim();
      const password = document.getElementById("blog-reg-pass").value.trim();
      if (!username || !email || !password) return;

      const newUser = {
        _id: "u-" + Date.now(),
        username,
        email,
        password,
        bio: "Full-Stack Developer & Blogger on Blog Market."
      };
      state.users.push(newUser);
      state.currentUser = newUser;
      saveBlogState();
      renderNavbar();
      navigateBlog("home");
      showBlogToast(`Account created! Logged in as @${username}`);
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadBlogState();
      renderNavbar();
      renderMainView();
    });
  </script>
</body>
</html>
